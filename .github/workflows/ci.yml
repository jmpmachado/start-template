name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-tooling:
    name: Web tooling
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tooling/package-lock.json

      - run: npm ci
        working-directory: tooling

      - run: npm run lint:all
        working-directory: tooling

      - run: npm test
        working-directory: tooling

  dotnet:
    name: .NET 9
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '9.0.x'

      - run: dotnet restore tests/backend/backend.tests.csproj
      - run: dotnet build tests/backend/backend.tests.csproj --no-restore -c Release
      - run: dotnet test tests/backend/backend.tests.csproj --no-build --no-restore -c Release
