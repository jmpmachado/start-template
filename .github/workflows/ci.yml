name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-tooling:
    name: Web tooling
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tooling/package-lock.json

      - run: npm ci
        working-directory: tooling

      - run: npm run lint:all
        working-directory: tooling

      - run: npm test
        working-directory: tooling

  dotnet:
    name: .NET 9
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - run: dotnet restore tests/backend/backend.tests.csproj
      - run: dotnet build tests/backend/backend.tests.csproj --no-restore -c Release
      - run: dotnet test tests/backend/backend.tests.csproj --no-build --no-restore -c Release
